services:
  - type: web
    name: taqdeer-mandal-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npx tsx api/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: APP_URL
        sync: false
